name: Keychain probe
on:
  pull_request:
    paths:
      - '.github/workflows/keychain-probe.yml'
permissions:
  contents: read
jobs:
  keychain:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Exercise Apple-tool credential writes
        shell: python
        run: |
          import ctypes
          import subprocess
          import uuid
          
          service = 'Speecher-CI-Keychain-Probe'
          account = str(uuid.uuid4())
          
          def run(*args, **kwargs):
              return subprocess.run(args, check=True, capture_output=True, timeout=4, **kwargs)
          
          def read():
              found = run('/usr/bin/security', 'find-generic-password', '-s', service, '-a', account, '-w').stdout[:-1]
              if not found.lstrip().startswith(b'{'):
                  found = bytes.fromhex(found.decode())
              return found
          
          security = ctypes.CDLL('/System/Library/Frameworks/Security.framework/Security')
          find = security.SecKeychainFindGenericPassword
          find.argtypes = [ctypes.c_void_p, ctypes.c_uint32, ctypes.c_char_p, ctypes.c_uint32, ctypes.c_char_p, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p]
          find.restype = ctypes.c_int32
          security.SecKeychainSetUserInteractionAllowed(False)
          
          def native_read():
              length = ctypes.c_uint32()
              data = ctypes.c_void_p()
              status = find(None, len(service), service.encode(), len(account), account.encode(), ctypes.byref(length), ctypes.byref(data), None)
              if data.value:
                  security.SecKeychainItemFreeContent(None, data)
              return status
          
          try:
              run('/usr/bin/security', 'add-generic-password', '-s', service, '-a', account, '-w', '{"token":"initial"}', '-T', '/usr/bin/security')
              assert native_read() != 0
              for payload in [b'{"token":"rotated"}', ' {"token":"dummy café 🎙", "quote":"\\\""} \n\n'.encode()]:
                  command = f'add-generic-password -U -s "{service}" -a "{account}" -X {payload.hex()}\n'.encode()
                  assert len(command) < 4096
                  run('/usr/bin/security', '-i', input=command)
                  assert read() == payload, 'Roundtrip differs'
                  assert native_read() != 0, 'Native reader unexpectedly trusted after write'
                  print('PASS stdin-only security write preserves bytes and native denial:', len(payload), 'bytes')
              run('/usr/bin/security', 'delete-generic-password', '-s', service, '-a', account)
              payload = b'{"token":"' + b'x' * 25000 + b'"}'
              run('/usr/bin/security', 'add-generic-password', '-s', service, '-a', account, '-w', payload.decode(), '-T', '/usr/bin/security')
              assert read() == payload
              print('PASS 25KB read unaffected by interactive write limit')
          finally:
              subprocess.run(['/usr/bin/security', 'delete-generic-password', '-s', service, '-a', account], capture_output=True, timeout=4)
